      <stop offset="0%" stop-color="#D35400"/>
      <stop offset="70%" stop-color="#A04000"/>
      <stop offset="100%" stop-color="#6E2C00"/>
    </radialGradient>
    <linearGradient id="horseMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
