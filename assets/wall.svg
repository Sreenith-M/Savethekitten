<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="wallPlank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <filter id="wallShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="84" height="84" rx="10" fill="url(#wallPlank)" filter="url(#wallShadow)"/>
  
  <!-- Wood grain slats -->
  <line x1="12" y1="36" x2="88" y2="36" stroke="#3E2723" stroke-width="4"/>
  <line x1="12" y1="64" x2="88" y2="64" stroke="#3E2723" stroke-width="4"/>
  <line x1="12" y1="38" x2="88" y2="38" stroke="#A1887F" stroke-width="1.5" opacity="0.4"/>
  <line x1="12" y1="66" x2="88" y2="66" stroke="#A1887F" stroke-width="1.5" opacity="0.4"/>

  <!-- Metal Rivets -->
  <circle cx="18" cy="18" r="3.5" fill="#B0BEC5" stroke="#37474F" stroke-width="1.5"/>
  <circle cx="82" cy="18" r="3.5" fill="#B0BEC5" stroke="#37474F" stroke-width="1.5"/>
  <circle cx="18" cy="82" r="3.5" fill="#B0BEC5" stroke="#37474F" stroke-width="1.5"/>
  <circle cx="82" cy="82" r="3.5" fill="#B0BEC5" stroke="#37474F" stroke-width="1.5"/>
</svg>
