<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="40%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing background halo -->
  <circle cx="50" cy="50" r="38" fill="#FDCB6E" opacity="0.25" filter="url(#starGlow)"/>

  <!-- Five Point Star -->
  <polygon points="50,10 61,35 88,38 68,56 73,83 50,70 27,83 32,56 12,38 39,35"
           fill="url(#starGrad)" stroke="#F39C12" stroke-width="2" stroke-linejoin="round" filter="url(#starGlow)"/>

  <!-- Sparkle highlights -->
  <circle cx="50" cy="42" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="56" cy="48" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
