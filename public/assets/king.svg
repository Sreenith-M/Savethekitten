<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="kingGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E17055"/>
      <stop offset="60%" stop-color="#D63031"/>
      <stop offset="100%" stop-color="#2D3436"/>
    </radialGradient>
    <filter id="kingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base -->
  <ellipse cx="50" cy="85" rx="34" ry="8" fill="url(#kingGrad)" filter="url(#kingShadow)"/>
  <path d="M 26 85 L 32 74 L 68 74 L 74 85 Z" fill="url(#kingGrad)"/>
  <ellipse cx="50" cy="73" rx="22" ry="4" fill="#636E72"/>

  <!-- Body -->
  <path d="M 34 72 C 38 56, 42 46, 38 38 L 62 38 C 58 46, 62 56, 66 72 Z" fill="url(#kingGrad)"/>
  <ellipse cx="50" cy="38" rx="18" ry="3.5" fill="#636E72"/>

  <!-- Imperial King Crown -->
  <path d="M 32 38 C 30 24, 40 22, 50 20 C 60 22, 70 24, 68 38 Z" fill="url(#kingGrad)" filter="url(#kingShadow)"/>

  <!-- Royal Cross -->
  <rect x="47" y="6" width="6" height="15" fill="#F1C40F"/>
  <rect x="42" y="10" width="16" height="5" fill="#F1C40F"/>
</svg>
