  <!-- Eyes -->
  <circle cx="38" cy="42" r="4.5" fill="#FFFFFF"/>
  <circle cx="39" cy="42" r="2.5" fill="#1E272E"/>

  <circle cx="62" cy="42" r="4.5" fill="#FFFFFF"/>
