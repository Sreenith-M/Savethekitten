  </defs>

  <!-- Big Elephant Ears -->
  <ellipse cx="22" cy="46" rx="16" ry="22" fill="url(#elephantEar)"/>
  <ellipse cx="78" cy="46" rx="16" ry="22" fill="url(#elephantEar)"/>

  <!-- Head -->
