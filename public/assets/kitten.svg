<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="catBody" cx="50%" cy="50%" r="50%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="60%" stop-color="#FFD6A5"/>
      <stop offset="100%" stop-color="#FFB366"/>
    </radialGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9999"/>
      <stop offset="100%" stop-color="#FF6B81"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2D3"/>
      <stop offset="100%" stop-color="#01A3A4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Cat Ears -->
  <polygon points="20,40 32,15 48,32" fill="#FFB366" filter="url(#softShadow)"/>
  <polygon points="24,37 33,20 44,32" fill="url(#earInner)"/>

  <polygon points="80,40 68,15 52,32" fill="#FFB366" filter="url(#softShadow)"/>
  <polygon points="76,37 67,20 56,32" fill="url(#earInner)"/>

  <!-- Head Base -->
  <ellipse cx="50" cy="55" rx="38" ry="32" fill="url(#catBody)" filter="url(#softShadow)"/>

  <!-- Cheeks fluff -->
  <path d="M 12 55 Q 8 62 16 68 Q 14 74 24 76" fill="#FFD6A5"/>
  <path d="M 88 55 Q 92 62 84 68 Q 86 74 76 76" fill="#FFD6A5"/>

  <!-- Big Cute Eyes -->
  <ellipse cx="36" cy="52" rx="9" ry="11" fill="url(#eyeGrad)"/>
  <ellipse cx="64" cy="52" rx="9" ry="11" fill="url(#eyeGrad)"/>

  <!-- Eye Pupils -->
  <circle cx="36" cy="53" r="6" fill="#1E272E"/>
  <circle cx="64" cy="53" r="6" fill="#1E272E"/>

  <!-- Eye Highlights -->
  <circle cx="33" cy="49" r="3" fill="#FFFFFF"/>
  <circle cx="38" cy="54" r="1.5" fill="#FFFFFF"/>
  <circle cx="61" cy="49" r="3" fill="#FFFFFF"/>
  <circle cx="66" cy="54" r="1.5" fill="#FFFFFF"/>

  <!-- Cute Pink Nose -->
  <polygon points="47,63 53,63 50,67" fill="#FF6B81"/>

  <!-- Mouth -->
  <path d="M 45 67 Q 50 71 50 68 Q 50 71 55 67" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="24" cy="63" rx="6" ry="3.5" fill="#FF9999" opacity="0.6"/>
  <ellipse cx="76" cy="63" rx="6" ry="3.5" fill="#FF9999" opacity="0.6"/>

  <!-- Whiskers -->
  <line x1="20" y1="58" x2="3" y2="54" stroke="#718093" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="18" y1="65" x2="2" y2="67" stroke="#718093" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="97" y2="54" stroke="#718093" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="82" y1="65" x2="98" y2="67" stroke="#718093" stroke-width="1.8" stroke-linecap="round"/>
</svg>
