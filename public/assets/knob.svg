<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="60%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#006266"/>
    </radialGradient>
    <filter id="knobGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <circle cx="50" cy="50" r="42" fill="#2D3436" stroke="#636E72" stroke-width="4"/>
  <circle cx="50" cy="50" r="32" fill="#1E272E"/>

  <!-- Glowing Crystal Knob -->
  <circle cx="50" cy="50" r="24" fill="url(#crystalGlow)" filter="url(#knobGlow)"/>
  
  <!-- Highlight shine -->
  <ellipse cx="44" cy="42" rx="7" ry="4" fill="#FFFFFF" opacity="0.75" transform="rotate(-30, 44, 42)"/>
  
  <!-- Icon symbol inside -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
</svg>
