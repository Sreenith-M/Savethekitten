<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </radialGradient>
    <filter id="magicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#magicGlow)">
    <!-- Central Big 4-point Sparkle -->
    <path d="M 50 15 Q 50 50 15 50 Q 50 50 50 85 Q 50 50 85 50 Q 50 50 50 15 Z" fill="url(#sparkleGrad)"/>
    
    <!-- Small diagonal sparkles -->
    <path d="M 76 24 Q 76 34 66 34 Q 76 34 76 44 Q 76 34 86 34 Q 76 34 76 24 Z" fill="#FFEAA7"/>
    <path d="M 24 66 Q 24 74 16 74 Q 24 74 24 82 Q 24 74 32 74 Q 24 74 24 66 Z" fill="#74B9FF"/>
  </g>
</svg>
