<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="knightGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#747D8C"/>
      <stop offset="70%" stop-color="#2F3542"/>
      <stop offset="100%" stop-color="#1E272E"/>
    </radialGradient>
    <filter id="knightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base -->
  <ellipse cx="50" cy="85" rx="34" ry="8" fill="url(#knightGrad)" filter="url(#knightShadow)"/>
  <path d="M 26 85 L 32 74 L 68 74 L 74 85 Z" fill="url(#knightGrad)"/>
  <ellipse cx="50" cy="73" rx="22" ry="4" fill="#57606F"/>

  <!-- Horse Head -->
  <path d="M 36 72 C 34 50, 30 38, 44 20 C 50 14, 60 14, 66 22 C 72 30, 74 44, 68 56 L 58 60 C 54 66, 60 70, 66 72 Z" fill="url(#knightGrad)" filter="url(#knightShadow)"/>

  <!-- Mane Serrations -->
  <polygon points="40,24 32,32 40,36" fill="#57606F"/>
  <polygon points="38,40 30,48 38,52" fill="#57606F"/>
  <polygon points="36,56 28,64 36,68" fill="#57606F"/>

  <!-- Horse Ear -->
  <polygon points="56,18 60,6 66,16" fill="url(#knightGrad)"/>

  <!-- Horse Eye -->
  <circle cx="60" cy="28" r="3.5" fill="#FFFFFF"/>
  <circle cx="61" cy="28" r="2" fill="#1E272E"/>

  <!-- Muzzle Line -->
  <path d="M 68 46 Q 74 44 76 50" stroke="#57606F" stroke-width="2" fill="none"/>
</svg>
