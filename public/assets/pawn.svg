<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="pawnGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#747D8C"/>
      <stop offset="70%" stop-color="#2F3542"/>
      <stop offset="100%" stop-color="#1E272E"/>
    </radialGradient>
    <filter id="pieceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base -->
  <ellipse cx="50" cy="85" rx="32" ry="8" fill="url(#pawnGrad)" filter="url(#pieceShadow)"/>
  <path d="M 28 85 L 34 72 L 66 72 L 72 85 Z" fill="url(#pawnGrad)"/>
  
  <!-- Collar Ring -->
  <ellipse cx="50" cy="71" rx="20" ry="4" fill="#57606F"/>

  <!-- Body -->
  <path d="M 36 70 C 38 52, 42 45, 42 38 L 58 38 C 58 45, 62 52, 64 70 Z" fill="url(#pawnGrad)"/>

  <!-- Neck Ring -->
  <ellipse cx="50" cy="38" rx="16" ry="3.5" fill="#57606F"/>

  <!-- Head Sphere -->
  <circle cx="50" cy="24" r="14" fill="url(#pawnGrad)" filter="url(#pieceShadow)"/>
  <circle cx="45" cy="20" r="3" fill="#FFFFFF" opacity="0.4"/>
</svg>
